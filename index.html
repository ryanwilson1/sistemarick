/* ══ 4j. FASE 15 — FOCO NA ABERTURA DA ORDEM ═══════════════════════════════
   Aditivo como as fases anteriores: nenhum seletor anterior foi reescrito.
   Três problemas de uso real, todos no celular do balcão.

   1. O botão do copiloto mora em `bottom: calc(78px + safe-area)` no celular
      — a mesma faixa onde ficam as ações do assistente de abertura. Quem ia
      tocar em "Continuar" acertava o robô. Durante a abertura da ordem a IA
      sai inteira de cena, com fade e deslize, e volta ao sair da tela.

   2. O teclado virtual encolhe o viewport VISUAL e deixa o de layout do
      mesmo tamanho. Por isso `position:sticky; bottom:0` sozinho continua
      sendo desenhado atrás dele. A medida vem do `visualViewport` (em
      app.js) e chega aqui como `--teclado`.

   3. Grade de preço em três colunas fixas não cabe em 320px de largura.
   ══════════════════════════════════════════════════════════════════════════ */

:root { --teclado: 0px; }

/* ── A IA entrando e saindo de cena ──────────────────────────────────────
   As duas regras vêm depois de `.flutuante:hover` e `.flutuante:active`, de
   mesma especificidade, e por isso mandam nelas durante a transição.      */
@keyframes surgeFlutuante { from { opacity:0; transform:translateY(22px) scale(.92) } to { opacity:1; transform:none } }
.flutuante { transition:transform .2s cubic-bezier(.16,1,.3,1), opacity .2s ease, box-shadow .16s; }
.flutuante[data-estado="entrando"] { animation:surgeFlutuante .38s cubic-bezier(.16,1,.3,1) backwards; }
.flutuante[data-estado="saindo"] { opacity:0; transform:translateY(22px) scale(.92); pointer-events:none; }

/* Com o teclado aberto o botão sobra em qualquer tela: ele cobre justamente
   a linha que a pessoa está preenchendo. */
html[data-teclado="aberto"] .flutuante { opacity:0; pointer-events:none; transform:translateY(16px); }

/* ── MELHORIA 3: a barra que carrega o "Continuar" ───────────────────────
   Gruda no rodapé da janela enquanto houver rolagem, sobe junto com o
   teclado e pousa no fim do documento quando a página acaba.              */
.barra-passo { position:sticky; bottom:16px; z-index:35;
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:var(--raio-g);
  background:var(--vidro); backdrop-filter:blur(16px) saturate(1.5);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);
  border:1px solid var(--linha); box-shadow:var(--sombra-media);
  transform:translateY(calc(-1 * var(--teclado)));
  transition:transform .22s cubic-bezier(.16,1,.3,1); }
.barra-passo .btn { flex-shrink:0; }
.barra-passo .btn-primario { min-width:150px; }

/* O total acompanha a ação: quem está prestes a seguir precisa saber por
   quanto. Ele encolhe antes de qualquer botão apertar. */
.total-passo { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;
  padding-left:4px; overflow:hidden; }
.total-passo .rotulo { font-size:9.5px; letter-spacing:.06em; }
.total-passo .mono { font-size:16px; font-weight:700; letter-spacing:-.02em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

@media (max-width:860px) {
  /* Acima da barra de navegação inferior, não em cima dela. */
  .barra-passo { bottom:calc(84px + env(safe-area-inset-bottom)); padding:9px 10px; gap:8px; }
  .barra-passo .btn-primario { min-width:0; flex:0 1 auto; padding:0 16px; }
  .total-passo .mono { font-size:15px; }
  /* Com o teclado aberto, a navegação sai da frente e devolve a altura à
     tela — o rodapé do sistema não é o que a pessoa está usando agora. */
  html[data-teclado="aberto"] .barra-inferior { transform:translateY(110%); }
  html[data-teclado="aberto"] .barra-passo { bottom:12px; }
  .barra-inferior { transition:transform .22s cubic-bezier(.16,1,.3,1); }
}
@media (max-width:380px) {
  .barra-passo { padding:8px; gap:6px; }
  .barra-passo .btn { padding:0 12px; }
  .total-passo { padding-left:2px; }
  .total-passo .mono { font-size:14px; }
}

/* ── Onde a pessoa está dentro do assistente ─────────────────────────────
   No celular a pastilha do passo esconde o nome por falta de espaço, e
   sobravam quatro bolinhas sem legenda.                                   */
.passo-atual { display:flex; align-items:baseline; justify-content:space-between;
  gap:10px; margin-top:11px; font-size:14px; }
.trilha-passo { height:4px; border-radius:99px; background:var(--linha-suave);
  overflow:hidden; margin-top:11px; }
.trilha-passo i { display:block; height:100%; border-radius:99px;
  background:linear-gradient(90deg, var(--azul-acao), var(--azul-acao-forte));
  transition:width .45s cubic-bezier(.16,1,.3,1); }

/* ── MELHORIA 2: o que é interno tem cara de interno ─────────────────────
   O tracejado e a etiqueta existem para quem está com o balcão do lado:
   olhando de relance dá para saber que aquele bloco não é para ser virado
   na direção do cliente.                                                  */
.bloco-interno { border:1px dashed var(--linha); border-radius:var(--raio);
  padding:13px; background:var(--superficie-2);
  display:flex; flex-direction:column; gap:10px; }
.bloco-interno .aviso-interno { display:flex; align-items:center; gap:6px;
  font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--tinta-3); }
.bloco-interno .resumo-linha + .resumo-linha { margin-top:0; }

.linha-lucro { display:flex; align-items:baseline; justify-content:space-between;
  gap:10px; padding-top:10px; border-top:1px solid var(--linha-suave); }
.valor-lucro { font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:17px; font-weight:700; letter-spacing:-.02em; color:var(--ok); }

/* O lucro no cadastro da peça é resultado, não campo: mesma altura de uma
   entrada, mas sem borda de digitação e sem cursor de texto. */
.caixa-lucro { height:42px; padding:0 12px; border-radius:var(--raio);
  background:var(--ok-fundo); border:1px solid transparent;
  display:flex; align-items:center; justify-content:space-between; gap:8px; }
.caixa-lucro.negativo { background:var(--erro-fundo); }
.caixa-lucro.negativo .valor-lucro { color:var(--erro); }

/* ── MELHORIA 4: as grades de lançamento em tela estreita ────────────────
   Antes: `120px 1fr` para tipo/descrição e `86px 1fr 1fr` para
   quantidade/custo/valor. Em 320px o campo de valor ficava com menos de
   noventa pixels úteis e o rótulo era cortado no meio.                    */
.grade-lancar { display:grid; grid-template-columns:120px 1fr; gap:11px; }
.grade-valores { display:grid; grid-template-columns:86px 1fr 1fr; gap:11px; }
.grade-valores.sem-custo { grid-template-columns:86px 1fr; }
.grade-valores .campo-valor { display:flex; flex-direction:column; min-width:0; }
@media (max-width:520px) {
  .grade-lancar { grid-template-columns:1fr; }
  .grade-valores, .grade-valores.sem-custo { grid-template-columns:88px 1fr; }
  /* O valor cobrado ganha a linha inteira: é o número que sai no orçamento. */
  .grade-valores:not(.sem-custo) .campo-valor { grid-column:1 / -1; }
}

/* O mesmo formulário dentro da ordem já aberta, agora com uma coluna a menos
   quando o papel não enxerga custo. */
.novo-item .campos.sem-custo { grid-template-columns:2fr 70px 1fr; }
@media (max-width:860px) { .novo-item .campos.sem-custo { grid-template-columns:1fr 1fr; } }

/* ── Acabamento do assistente ────────────────────────────────────────────
   Alvo de toque cheio nas pastilhas de passo e nada de texto cortado nos
   cartões estreitos.                                                      */
/* A barra de ação não entra escalonada: ela é mobília fixa da tela, não
   conteúdo que chega. */
.entra > .barra-passo { animation:none; }

/* AUDITORIA (fase 16): a caixa de busca tem 38px, mas o <input> dentro dela
   media 22 — os 16px restantes não focavam nada e o dedo errava o campo.
   Agora o campo ocupa a caixa inteira. */
.busca { position:relative; }
.busca input { align-self:stretch; height:100%; min-height:36px; }

.passo { min-height:34px; }
@media (max-width:860px) { .passo { min-height:40px; padding:7px 13px; } }
.linha-item > div { overflow-wrap:anywhere; }
</style>
</head>
